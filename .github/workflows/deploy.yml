name: Build and deploy (Quartz)
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
# Let an in-progress deploy finish; queue the newest push behind it
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Quartz uses git history for page dates
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Local plugins can't be locked portably (quartz.lock.json stores an
      # absolute path), so link ./plugins/* into the plugin cache by hand.
      - name: Link local plugins
        run: |
          mkdir -p .quartz/plugins
          ln -sfn ../../plugins/footer .quartz/plugins/footer
          ln -sfn ../../plugins/rss .quartz/plugins/rss
          ln -sfn ../../plugins/bluesky-embed .quartz/plugins/bluesky-embed
          ln -sfn ../../plugins/tag-link-text .quartz/plugins/tag-link-text
          ln -sfn ../../plugins/post-nav .quartz/plugins/post-nav
          ln -sfn ../../plugins/post-author .quartz/plugins/post-author
          ln -sfn ../../plugins/iso-dates .quartz/plugins/iso-dates
          ln -sfn ../../plugins/pele-diagrams .quartz/plugins/pele-diagrams
          ln -sfn ../../plugins/pdf-embed .quartz/plugins/pdf-embed
      # Refuse to deploy if a published page contains a blacklisted term
      - name: Publish check
        working-directory: content
        run: |
          if [ -f wiki/scripts/publish_check.py ]; then python3 wiki/scripts/publish_check.py; fi
      # Typst/Marp sources use Hiragino locally; Noto CJK is their fallback here
      - name: Install CJK fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/typst/packages
          key: typst-packages-${{ hashFiles('content/wiki/**/*.typ') }}
          restore-keys: typst-packages-
      - run: npx quartz plugin install
      - run: npx quartz build -d content/wiki
      - run: node scripts/build-pdfs.mjs content/wiki public
      - run: cp robots.txt public/robots.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
